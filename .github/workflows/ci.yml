name: reference checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/blocks-feedback/requirements-tested.txt
      - run: python -m pip install --no-deps -e packages/blocks-feedback
      - run: python -m pytest -c /dev/null -p no:cacheprovider packages/blocks-feedback/tests -q
      - run: PYTHONPATH=packages/blocks-admission python -m unittest discover -s packages/blocks-admission/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:client
      - run: npm run check:widget
